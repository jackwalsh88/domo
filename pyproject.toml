[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termstyle"
version = "0.1.0"
description = "Cyberpunk banners, status lines and prompts for the terminal"
requires-python = ">=3.8"

[project.scripts]
termstyle = "termstyle.__main__:main"

[tool.setuptools]
packages = ["termstyle"]
